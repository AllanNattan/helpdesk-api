name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and pytest
    runs-on: ubuntu-latest

    env:
      DATABASE_PASSWORD: "ci-only-dummy-password"
      JWT_SECRET_KEY: "ci-only-jwt-secret-not-for-production-at-least-32-characters"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check code style with Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest
